<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17130f">
<title>ZORE AI · Uji Babylon.js</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17130f;color:#f4efdf;font-family:Inter,system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(110deg,#211b18,#3b281d);border-bottom:1px solid #92734c}.brand{font-size:11px;letter-spacing:.18em;color:#d2b47c}.heading{font-size:16px;font-weight:700;margin-top:3px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{background:#30241c;color:#f4efdf;border:1px solid #92734c;border-radius:8px;padding:8px 10px;font-size:12px}#viewport{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 50% 20%,#b6a38b,#5c5148 65%,#211b18)}canvas{width:100%;height:100%;display:block;touch-action:none;outline:0}.hint{position:absolute;left:12px;bottom:12px;padding:8px 11px;border-radius:8px;background:#17130fbd;color:#eee0c8;font-size:11px;pointer-events:none}.stats{position:absolute;right:12px;bottom:12px;padding:8px 11px;border-radius:8px;background:#17130fbd;color:#eee0c8;font-size:11px}.foot{padding:8px 14px;background:#17130f;border-top:1px solid #4b392a;color:#c6ad83;font-size:10px;display:flex;justify-content:space-between;gap:10px}.status{color:#a9d7b8}@media(max-width:600px){.top{align-items:flex-start}.heading{font-size:14px}.tools{justify-content:flex-end}button,select{padding:7px 8px}.foot{font-size:9px}}
</style>
</head>
<body><div id="app">
<header class="top"><div><div class="brand">ZORE AI · RENDER ENGINE TEST</div><div class="heading">Kantor Virtual · Babylon.js</div></div><div class="tools"><select id="quality" aria-label="Kualitas grafis"><option value="auto">Otomatis</option><option value="low">Ringan</option><option value="high">Tinggi</option></select><button id="loadOffice" type="button">Muat model Blender</button><button id="restoreOffice" type="button" hidden>Kembalikan kantor</button><input id="officeModel" type="file" accept=".glb,model/gltf-binary" hidden><button id="reset" type="button">Reset kamera</button></div></header>
<main id="viewport"><canvas id="renderCanvas" aria-label="Pratinjau kantor virtual Babylon.js"></canvas><div class="hint">Geser untuk memutar · cubit untuk zoom · dua jari untuk menggeser</div><div class="stats" id="stats">Menyiapkan mesin 3D…</div></main>
<footer class="foot"><span>BABYLON.JS · IMPOR MODEL BLENDER GLB</span><span class="status" id="engineStatus">Memuat Babylon.js</span></footer>
</div><script type="module" src="/src/babylon-preview.js"></script></body></html>
