name: ZORE AI Employee Blender Worker

on:
  workflow_dispatch:
    inputs:
      task_name:
        description: "Nama tugas karyawan"
        required: true
        type: string
      employee:
        description: "Nama/jabatan karyawan"
        required: true
        default: "AI 3D Designer"
        type: string
      blender_script:
        description: "Kode Python Blender yang sudah dibuat dan diperiksa karyawan (maksimal 20000 karakter)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zore-blender-worker-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  blender-task:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout task templates
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy ffmpeg

      - name: Prepare employee task
        env:
          TASK_NAME: ${{ inputs.task_name }}
          EMPLOYEE: ${{ inputs.employee }}
          BLENDER_SCRIPT: ${{ inputs.blender_script }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          script = os.environ.get("BLENDER_SCRIPT", "")
          if not script.strip():
              raise SystemExit("Kode Blender kosong.")
          if len(script) > 20000:
              raise SystemExit("Kode melebihi batas 20.000 karakter.")
          pathlib.Path("/tmp/zore_employee_task.py").write_text(script, encoding="utf-8")
          pathlib.Path("task-info.txt").write_text(
              "Tugas: " + os.environ.get("TASK_NAME", "") + "\\n" +
              "Karyawan: " + os.environ.get("EMPLOYEE", "") + "\\n" +
              "Runner: GitHub Actions ephemeral Ubuntu + Blender\\n",
              encoding="utf-8"
          )
          PY

      - name: Execute Blender employee task
        run: |
          mkdir -p output
          ZORE_OUTPUT_DIR="$GITHUB_WORKSPACE/output" blender --background --python /tmp/zore_employee_task.py

      - name: Create starter deliverable if employee script produced none
        run: |
          if [ -z "$(find output -type f -print -quit)" ]; then
            echo "Skrip tugas tidak membuat file. Membuat model meja starter agar workflow tetap menghasilkan artefak."
            cat > /tmp/zore_starter_desk.py <<'PY'
          import bpy, os
          from mathutils import Vector
          out = os.environ["ZORE_OUTPUT_DIR"]
          os.makedirs(out, exist_ok=True)
          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete(use_global=False)
          def mat(name, color, metallic=0.0):
              m=bpy.data.materials.new(name); m.diffuse_color=(*color,1); m.use_nodes=True
              p=m.node_tree.nodes.get("Principled BSDF")
              p.inputs["Base Color"].default_value=(*color,1); p.inputs["Metallic"].default_value=metallic
              p.inputs["Roughness"].default_value=0.38
              return m
          wood=mat("Walnut", (0.25,0.12,0.055)); metal=mat("Black Metal",(0.025,0.03,0.035),0.65)
          def cube(name, loc, dims, material, bevel=0.025):
              bpy.ops.mesh.primitive_cube_add(size=1, location=loc)
              o=bpy.context.object; o.name=name; o.dimensions=dims
              bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)
              o.data.materials.append(material)
              if bevel:
                  b=o.modifiers.new("Rounded edges","BEVEL"); b.width=bevel; b.segments=3
                  o.modifiers.new("Weighted normals","WEIGHTED_NORMAL")
              return o
          cube("Walnut desktop",(0,0,1.5),(2.2,1.0,0.12),wood)
          for x in (-0.98,0.98):
              for y in (-0.38,0.38):
                  cube("Metal leg",(x,y,0.75),(0.07,0.07,1.45),metal,0.012)
          cube("Front modesty panel",(0,-0.43,1.25),(1.8,0.045,0.28),metal,0.01)
          cube("Drawer unit",(0.62,0.08,1.22),(0.48,0.72,0.48),wood)
          bpy.ops.wm.save_as_mainfile(filepath=os.path.join(out,"zore-starter-desk.blend"))
          bpy.ops.export_scene.gltf(filepath=os.path.join(out,"zore-starter-desk.glb"),export_format="GLB")
          print("ZORE STARTER MODEL CREATED")
          PY
            ZORE_OUTPUT_DIR="$GITHUB_WORKSPACE/output" blender --background --python /tmp/zore_starter_desk.py
          fi


      - name: Encode rendered Blender frames to MP4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, shutil
          out=Path('output')
          frames=sorted([*out.glob('render_*.png'),*out.glob('frame_*.png')])
          if not frames:
              print('Tidak ada urutan frame PNG; MP4 dilewati. File Blender/GLB tetap diserahkan bila tersedia.')
              raise SystemExit(0)
          seq=out/'video_frames'; seq.mkdir(exist_ok=True)
          for p in seq.iterdir():
              if p.is_file(): p.unlink()
          for i,p in enumerate(frames): shutil.copy2(p,seq/f'frame_{i:06d}.png')
          subprocess.run(['ffmpeg','-y','-framerate','24','-i',str(seq/'frame_%06d.png'),'-c:v','libx264','-pix_fmt','yuv420p','-movflags','+faststart',str(out/'blender-animation.mp4')],check=True)
          print(f'MP4 dibuat dari {len(frames)} frame.')
          PY

      - name: Validate deliverables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          out = Path("output")
          files = [p for p in out.rglob("*") if p.is_file()]
          if not files:
              raise SystemExit("Tidak ada file hasil di output/.")
          for p in files:
              if p.stat().st_size == 0:
                  raise SystemExit(f"File kosong: {p}")
              print(f"DELIVERABLE {p} {p.stat().st_size} bytes")
          PY

      - name: Upload employee deliverables
        uses: actions/upload-artifact@v4
        with:
          name: zore-employee-blender-${{ github.run_number }}
          path: |
            output/**
            task-info.txt
          if-no-files-found: error
          retention-days: 7
