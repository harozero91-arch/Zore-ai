name: Verify ZORE AI website build

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**', 'feat/**', 'zore-artifact/**']
    paths:
      - "index.js"
      - "src/**"
      - "package.json"
      - "vite.config.js"
      - "index.html"
      - "office.css"
      - "public/**"
      - "supabase/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
